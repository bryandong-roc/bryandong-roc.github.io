media:
  input: assets/images
  output: /assets/images
  categories: [image]
  rename: safe
content:
  - name: "site"
    label: "網站設定"
    type: "file"
    path: "data/site-settings.json"
    format: "json"
    fields:
      - name: "name"
        label: "姓名"
        type: "string"
        description: "顯示於導覽列與頁尾"
      - name: "en"
        label: "英文名"
        type: "string"
        description: "例如 Jian-Yi Dong，全站請保持一致"
      - name: "brand"
        label: "品牌名稱"
        type: "string"
      - name: "tagline"
        label: "首頁標語"
        type: "string"
        description: "首頁最大的那一句話"
      - name: "intro"
        label: "首頁副標"
        type: "text"
        description: "首頁標語下方的一行小字"
      - name: "photo"
        label: "個人照片"
        type: "image"
        description: "首頁右側的照片，建議直式、已移除拍攝資料"
      - name: "photo_alt"
        label: "照片替代文字"
        type: "string"
        description: "給視障者與搜尋引擎看的照片說明"
      - name: "email"
        label: "Email"
        type: "string"
      - name: "linkedin"
        label: "LinkedIn 網址"
        type: "string"
      - name: "site_url"
        label: "網站網址"
        type: "string"
        description: "正式網址，供搜尋與分享使用"
  - name: "about"
    label: "關於我"
    type: "file"
    path: "data/about.json"
    format: "json"
    fields:
      - name: "intro"
        label: "自我介紹"
        type: "text"
        description: "分段請用換行；中文段落在上，網頁會原樣顯示"
      - name: "background"
        label: "專業背景"
        type: "string"
        description: "每一項一條；網頁以條列顯示"
        list: true
      - name: "focus"
        label: "關注領域"
        type: "string"
        description: "顯示為小標籤，每個領域一條"
        list: true
      - name: "philosophy"
        label: "工作理念"
        type: "text"
        description: "可用換行分成兩行"
  - name: "roles"
    label: "核心職能與期待職位"
    type: "file"
    path: "data/roles.json"
    format: "json"
    fields:
      - name: "lead"
        label: "區塊說明"
        type: "text"
        description: "標題下方的一小段話"
      - name: "items"
        label: "職能項目"
        type: "object"
        description: "目前網站設計為四個，增減請留意版面"
        list: true
        fields:
          - name: "name"
            label: "職能名稱"
            type: "string"
          - name: "en"
            label: "英文名稱"
            type: "string"
          - name: "summary"
            label: "一句話說明"
            type: "text"
          - name: "proof"
            label: "代表成果"
            type: "string"
            description: "每一條成果一項，建議 2 到 4 條"
            list: true
  - name: "timeline"
    label: "人生與職涯歷程"
    type: "file"
    path: "data/timeline.json"
    format: "json"
    fields:
      - name: "items"
        label: "經歷節點"
        type: "object"
        description: "魚骨圖上的每一個方框；不顯示年份"
        list: true
        fields:
          - name: "title"
            label: "職稱"
            type: "string"
            required: true
            description: "方框內第二行文字"
          - name: "slug"
            label: "識別碼"
            type: "string"
            description: "每個節點唯一，建議用英文與數字，例如 tl-9"
          - name: "organization"
            label: "機構名稱"
            type: "string"
            description: "方框內第一行文字"
          - name: "role"
            label: "備註"
            type: "string"
            description: "通常留空"
          - name: "type"
            label: "類別"
            type: "select"
            description: "職涯顯示在上排，社會參與與求學顯示在下排"
            options:
              values:
                - "職涯"
                - "社會參與"
                - "求學與研究"
          - name: "description"
            label: "簡述"
            type: "text"
            description: "點開視窗後的第一段說明"
          - name: "highlights"
            label: "成果重點"
            type: "string"
            description: "每一條成果一項"
            list: true
          - name: "image"
            label: "照片（選填）"
            type: "image"
            description: "目前網站尚未顯示此欄位，之後會支援"
          - name: "external_url"
            label: "相關連結（選填）"
            type: "string"
          - name: "status"
            label: "狀態"
            type: "select"
            description: "draft=草稿（網站不顯示）；published=公開；unpublished=下架"
            options:
              values:
                - "draft"
                - "published"
                - "unpublished"
          - name: "sort_order"
            label: "排序"
            type: "number"
            description: "數字小的排前面"
  - name: "architecting"
    label: "商業創構"
    type: "file"
    path: "data/business-architecting.json"
    format: "json"
    fields:
      - name: "definition"
        label: "定義說明"
        type: "text"
        description: "區塊標題下的一句話"
      - name: "steps"
        label: "五個階段"
        type: "object"
        description: "產業洞察到價值實現；請維持五項"
        list: true
        fields:
          - name: "name"
            label: "階段名稱"
            type: "string"
          - name: "en"
            label: "英文名稱"
            type: "string"
          - name: "summary"
            label: "說明"
            type: "text"
          - name: "cases"
            label: "案例"
            type: "string"
            description: "點開後顯示，每個案例一條"
            list: true
          - name: "status"
            label: "狀態"
            type: "select"
            description: "draft=草稿（網站不顯示）；published=公開；unpublished=下架"
            options:
              values:
                - "draft"
                - "published"
                - "unpublished"
          - name: "sort_order"
            label: "排序"
            type: "number"
            description: "數字小的排前面"
  - name: "life"
    label: "生活探索"
    type: "file"
    path: "data/life.json"
    format: "json"
    fields:
      - name: "categories"
        label: "生活分類"
        type: "object"
        description: "每個分類顯示為一疊照片，每次載入隨機顯示一張"
        list: true
        fields:
          - name: "name"
            label: "分類名稱"
            type: "string"
          - name: "en"
            label: "英文名稱"
            type: "string"
          - name: "summary"
            label: "一句話說明"
            type: "text"
          - name: "photos"
            label: "照片"
            type: "object"
            description: "建議 3 到 5 張，最多顯示 5 張；4:3 橫式，約 1200×900，WebP，已移除拍攝資料"
            list: true
            fields:
              - name: "image"
                label: "照片"
                type: "image"
              - name: "alt"
                label: "替代文字"
                type: "string"
                description: "一句話描述照片內容"
          - name: "status"
            label: "狀態"
            type: "select"
            description: "draft=草稿（網站不顯示）；published=公開；unpublished=下架"
            options:
              values:
                - "draft"
                - "published"
                - "unpublished"
          - name: "sort_order"
            label: "排序"
            type: "number"
            description: "數字小的排前面"
